<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Master</title>
  <meta name="description" content="Challenge the Future, One Move at a Time.">
  <meta name="keywords" content="chess, scacchi, chess master, online chess, chess AI, chess strategy">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Chess Master">
  <meta property="og:description" content="Challenge the Future, One Move at a Time.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Chess Master">
  <meta name="twitter:description" content="Challenge the Future, One Move at a Time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#6b46d8">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .catch(err => console.warn('Service Worker error:', err));
    }
  </script>
</head>

<body>
  <div class="bg-pattern"></div>
  <a href="/"><img id="logo"></a>
  <div class="hero-container" id="hero">
    <div class="nav-links">
      <a id="active" href="/">ONLINE</a>
      <span>·</span>
      <a href="/LOCAL">LOCAL</a>
    </div>
    <h1><span class="title-top">CHESS</span><span class="title-bottom">MASTER</span></h1>
    <p class="subtitle">"Challenge the Future, One Move at a Time."</p>
    <div id="container">
      <div class="input-group">
        <input type="text" autocomplete="off" maxlength="6" id="codeInput" placeholder="Enter code or just enter..."
          onkeydown="if (event.key === 'Enter') connectWithCode()"
          oninput="this.classList.remove('error', 'success'); document.getElementById('error').style.display = 'none';">
        <p id="error"></p>
      </div>
      <button id="enterGameBtn" onclick="connectWithCode()"><svg style="transform: rotate(-90deg);"
          xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor"
          stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path>
        </svg><span id="enterGameLabel">Enter Game</span></button>
    </div>
    <section id="recentReplays" class="recent-replays" style="display:none">
      <!-- <h2>Recent replays</h2> -->
      <ul id="replayList"></ul>
    </section>
    <div id="footerWrap">
      <a id="link" href="/about">About</a>
      <span>·</span>
      <a id="link" href="/credits">Credits</a>
    </div>
  </div>
  <script>
    async function connectWithCode() {
      const codeInput = document.getElementById('codeInput');
      const error = document.getElementById('error');
      if (!codeInput) return;

      let isOnline = navigator.onLine;
      if (isOnline) {
        try {
          const response = await fetch('/api', {
            method: 'GET',
            cache: 'no-store'
          });
          isOnline = response.ok;
        } catch (err) {
          isOnline = false;
        }
      }

      if (!isOnline) {
        error.textContent = 'YOU ARE OFFLINE';
        error.className = 'error';
        error.style.display = 'block';
        codeInput.classList.add('error');
        return;
      }

      let code = codeInput.value.trim();
      if (!code) {
        window.location.href = "/ONLINE";
        return;
      }
      code = code.toUpperCase();
      if (code === 'ONLINE') {
        window.location.href = "/ONLINE";
        return;
      }

      if (code.length !== 6) {
        error.textContent = 'INVALID CODE LENGTH';
        error.className = 'error';
        error.style.display = 'block';
        codeInput.classList.add('error');
        return;
      }

      try {
        let res = await fetch(`/api/games/${encodeURIComponent(code)}`);
        if (!res.ok) throw new Error('bad status');
        let data = await res.json();
        if (data?.exist) {
          window.location.href = "/" + code;
          return;
        }

        res = await fetch(`/api/replays/${encodeURIComponent(code)}`);
        if (!res.ok) throw new Error('bad status');
        data = await res.json();
        if (data?.exist) {
          window.location.href = "/" + code;
          return;
        }

        if (error) {
          error.textContent = 'GAME NOT FOUND';
          error.className = 'error';
          error.style.display = 'block';
        }
        codeInput.classList.add('error');
      } catch {
        if (error) {
          error.textContent = 'API Error.';
          error.className = 'error';
          error.style.display = 'block';
        }
        codeInput.classList.add('error');
      }
    }

    function setRandomFavicon() {
      const pieces = ['wk', 'wq', 'wr', 'wb', 'wn', 'wp'];
      const randomPiece = pieces[Math.floor(Math.random() * pieces.length)];
      const faviconUrl = `/pieces/${randomPiece}.png`;

      const link = document.createElement('link');
      link.rel = 'icon';
      link.href = faviconUrl;
      document.head.appendChild(link);

      const logo = document.getElementById('logo');
      if (logo) {
        logo.src = faviconUrl;
      }
    }

    setRandomFavicon();

    function timeAgo(date) {
      const previousTime = typeof date === 'object' ? date.getTime() : new Date(date).getTime();
      const currentTime = Date.now();

      const msPerCurrent = currentTime - previousTime;

      const seconds = Math.floor(msPerCurrent / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (seconds < 5) {
        return "just now";
      } else if (seconds < 60) {
        return `${seconds}s ago`;
      } else if (minutes < 60) {
        return `${minutes}m ago`;
      } else if (hours < 24) {
        return `${hours}h ago`;
      } else if (days < 7) {
        return `${days}d ago`;
      } else if (days < 14) {
        return "1w ago";
      } else {
        return new Date(previousTime).toLocaleDateString();
      }
    }

    async function loadRecentReplays() {
      const panel = document.getElementById('recentReplays');
      const replayList = document.getElementById('replayList');
      try {
        const response = await fetch('/api/replays', { cache: 'no-store' });
        if (!response.ok) return;
        const games = await response.json();
        if (!Array.isArray(games) || games.length === 0) return;

        for (const replay of games.slice(0, 1)) {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = `/${encodeURIComponent(replay.code)}`;
          link.textContent = `REPLAY · ${replay.result.toUpperCase()} · ${timeAgo(replay.date).toUpperCase()}`;
          item.appendChild(link);
          replayList.appendChild(item);
        }
        panel.style.display = 'block';
      } catch { }
    }

    loadRecentReplays();

    function randomizeTitleCase() {
      const top = document.querySelector('.title-top');
      const bottom = document.querySelector('.title-bottom');
      if (!top || !bottom) return;

      const render = (el, text) => {
        el.innerHTML = '';
        for (const ch of text) {
          if (ch === ' ') {
            el.appendChild(document.createTextNode(' '));
            continue;
          }
          const span = document.createElement('span');
          const upper = Math.random() < 0.5;
          span.textContent = upper ? ch.toUpperCase() : ch.toLowerCase();
          el.appendChild(span);
        }
      };

      render(top, 'CHESS');
      render(bottom, 'MASTER');
    }

    randomizeTitleCase();
    function setupEnterGameTyping() {
      const input = document.getElementById('codeInput');
      const label = document.getElementById('enterGameLabel');
      const enterGameButton = document.getElementById('enterGameBtn');
      const modeChoices = document.getElementById('modeChoices');
      if (!input || !label) return;

      const phrases = [
        'Wanna Play?',
        'Click Me!',
        'Ready for Checkmate?',
        'Make Your Move',
        'Man vs AI: Who Wins?',
        'Let\'s Duel',
        'Fight the Engine!'
      ];

      const defaultText = 'Enter Game';
      let phraseIndex = 0;
      let charIndex = 0;
      let direction = 1;
      let timeoutId = null;
      let mode = 'phrases';
      let startupTimeoutId = null;
      let initialHold = true;

      const speeds = {
        type: 95,
        erase: 55,
        hold: 1400,
        between: 650,
        toDefaultType: 70,
        toDefaultErase: 45,
        toDefaultGap: 140
      };

      const clearTimer = () => {
        if (timeoutId) {
          clearTimeout(timeoutId);
          timeoutId = null;
        }
      };

      const hasInput = () => input.value.trim().length > 0;

      const startToDefault = () => {
        if (startupTimeoutId) {
          clearTimeout(startupTimeoutId);
          startupTimeoutId = null;
          initialHold = false;
        }
        mode = 'toDefault';
        direction = -1;
        charIndex = label.textContent.length;
        label.classList.add('typing');
        clearTimer();
        timeoutId = setTimeout(tick, 0);
      };

      const startPhrases = () => {
        if (startupTimeoutId) {
          clearTimeout(startupTimeoutId);
          startupTimeoutId = null;
          initialHold = false;
        }
        label.classList.add('typing');
        clearTimer();
        if (label.textContent.length > 0) {
          mode = 'eraseForPhrases';
          direction = -1;
          charIndex = label.textContent.length;
          timeoutId = setTimeout(tick, speeds.erase);
          return;
        }

        mode = 'phrases';
        direction = 1;
        charIndex = 0;
        timeoutId = setTimeout(tick, speeds.between);
      };

      const tick = () => {
        if (hasInput()) {
          if (mode === 'defaultIdle') return;
          if (mode !== 'toDefault') {
            mode = 'toDefault';
            direction = -1;
            charIndex = label.textContent.length;
            label.classList.add('typing');
          }

          if (direction === -1) {
            charIndex = Math.max(0, charIndex - 1);
            label.textContent = label.textContent.slice(0, charIndex);
            if (charIndex === 0) {
              direction = 1;
              timeoutId = setTimeout(tick, speeds.toDefaultGap);
              return;
            }
            timeoutId = setTimeout(tick, speeds.toDefaultErase);
            return;
          }

          charIndex = Math.min(defaultText.length, charIndex + 1);
          label.textContent = defaultText.slice(0, charIndex);
          if (charIndex === defaultText.length) {
            label.classList.remove('typing');
            mode = 'defaultIdle';
            clearTimer();
            return;
          }
          timeoutId = setTimeout(tick, speeds.toDefaultType);
          return;
        }

        if (mode === 'defaultIdle') {
          startPhrases();
          return;
        }

        if (mode === 'eraseForPhrases') {
          charIndex = Math.max(0, charIndex - 1);
          label.textContent = label.textContent.slice(0, charIndex);
          if (charIndex === 0) {
            mode = 'phrases';
            direction = 1;
            charIndex = 0;
            timeoutId = setTimeout(tick, speeds.between);
            return;
          }
          timeoutId = setTimeout(tick, speeds.erase);
          return;
        }

        label.classList.add('typing');
        const current = phrases[phraseIndex];

        if (direction === 1) {
          charIndex++;
          label.textContent = current.slice(0, charIndex);
          if (charIndex >= current.length) {
            direction = -1;
            timeoutId = setTimeout(tick, speeds.hold);
            return;
          }
          timeoutId = setTimeout(tick, speeds.type);
          return;
        }

        charIndex--;
        label.textContent = current.slice(0, charIndex);
        if (charIndex <= 0) {
          direction = 1;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          timeoutId = setTimeout(tick, speeds.between);
          return;
        }
        timeoutId = setTimeout(tick, speeds.erase);
      };

      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^a-zA-Z0-9]/g, "");
        if (hasInput()) {
          if (initialHold && label.textContent === defaultText) {
            if (startupTimeoutId) {
              clearTimeout(startupTimeoutId);
              startupTimeoutId = null;
            }
            initialHold = false;
            mode = 'defaultIdle';
            label.classList.remove('typing');
            clearTimer();
            return;
          }
          if (mode === 'defaultIdle' || mode === 'toDefault') return;
          startToDefault();
          return;
        }

        if (mode !== 'phrases') {
          startPhrases();
        }
      });

      startupTimeoutId = setTimeout(() => {
        initialHold = false;
        if (!hasInput()) startPhrases();
      }, 3000);
    }

    setupEnterGameTyping();

    if (sessionStorage.getItem('gameEnded')) {
      const error = document.getElementById('error');
      const codeInput = document.getElementById('codeInput');
      if (error && codeInput) {
        error.textContent = 'Game Ended';
        error.className = 'success';
        error.style.display = 'block';
        codeInput.classList.add('success');
        sessionStorage.removeItem('gameEnded');

        setTimeout(() => {
          error.style.display = 'none';
          error.textContent = '';
          codeInput.classList.remove('success');
        }, 2000);
      }
    }

    if (sessionStorage.getItem('gameNotFound') || sessionStorage.getItem('replayNotFound')) {
      const error = document.getElementById('error');
      const codeInput = document.getElementById('codeInput');
      if (error && codeInput) {
        error.textContent = sessionStorage.getItem('gameNotFound') ? 'Game not found.' : 'Replay not found.';
        error.className = 'error';
        error.style.display = 'block';
        codeInput.classList.add('error');
        sessionStorage.removeItem('gameNotFound');
        sessionStorage.removeItem('replayNotFound');

        setTimeout(() => {
          error.style.display = 'none';
          error.textContent = '';
          codeInput.classList.remove('error');
        }, 2000);
      }
    }

    setRandomFavicon();
    randomizeTitleCase();
  </script>
</body>

</html>
