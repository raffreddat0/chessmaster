<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Master</title>
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#6b46d8">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .catch(err => console.warn('Service Worker error:', err));
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
    integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
    integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
    integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"
    integrity="sha384-s3XgLpvmHyscVpijnseAmye819Ee3yaGa8NxstkJVyA6nuDFjt59u1QvuEl/mecz"
    crossorigin="anonymous"></script>
</head>

<body>
  <div class="bg-pattern"></div>
  <a href="/LOCAL"><img id="logo" alt="Chess Master" src="/pieces/wk.png"></a>

  <div id="loadingScreen"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:500; flex-direction:column; align-items:center; justify-content:center;">
    <img id="loadingLogo" alt="Loading" style="width:100px; height:100px;" src="/pieces/wk.png">
  </div>

  <div class="hero-container" id="connectPanel">
    <div class="nav-links">
      <a href="/">ONLINE</a>
      <span>·</span>
      <a id="active" href="/LOCAL">LOCAL</a>
    </div>
    <h1><span class="title-top">CHESS</span><span class="title-bottom">MASTER</span></h1>
    <p class="subtitle">"Challenge the Future, One Move at a Time."</p>
    <div id="container">
      <div id="lanPanel" style="display:flex">
        <button id="lanConnectBtn" type="button" onclick="connectToChessMasterBle()">Connect device</button>
        <p id="lanStatus">Select a connected Chess Master device to continue.</p>
      </div>
    </div>
    <div id="footerWrap">
      <a id="link" href="/about">About</a>
      <span>·</span>
      <a id="link" href="/credits">Credits</a>
    </div>
  </div>

  <div id="lanGame" style="display:none">
    <div id="board"></div>
    <div id="historyPanel">
      <div>
        <div class="history-header">Game Time</div>
        <div id="gameTimerDisplay">00:00</div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div class="history-header">Move History</div>
        <div id="moveListContent"></div>
        <div class="ai-toggle-wrap">
          <button class="ai-toggle active" id="aiToggleBtn" type="button" aria-pressed="true" title="Disattiva AI"
            onclick="toggleAi()">
            <span class="ai-toggle-led" aria-hidden="true"></span>
            <span id="aiToggleLabel">AI ON</span>
          </button>
        </div>
        <div id="historyControls">
          <button class="nav-btn" id="btnFirstMove" onclick="showPastMove(0)" title="First Move"><svg
              viewBox="0 0 24 24">
              <path d="M18.41 16.59L13.82 12l4.59-4.59L17 6l-6 6 6 6zM6 6h2v12H6z" />
            </svg></button>
          <button class="nav-btn" id="btnPrevMove" onclick="prevMove()" title="Previous Move"><svg viewBox="0 0 24 24">
              <path d="M15.41 16.59L10.82 12l3.18-3.18L14 6l-6 6 6 6z" />
            </svg></button>
          <button class="nav-btn" id="btnAutoPlay" onclick="toggleAutoPlay()" title="Auto Play"><svg
              viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg></button>
          <button class="nav-btn" id="btnNextMove" onclick="nextMove()" title="Next Move"><svg viewBox="0 0 24 24">
              <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" />
            </svg></button>
          <button class="nav-btn" id="btnLastMove" onclick="backToPresent()" title="Current Position"><svg
              viewBox="0 0 24 24">
              <path d="M5.59 7.41L10.18 12l-4.59-4.59L7 18l6-6-6-6zM16 6h2v12h-2z" />
            </svg></button>
        </div>
      </div>
    </div>
    <div id="island">
      <div id="islandHandle"></div>
      <div id="islandCollapsed"><span id="islandStatus"></span></div>
      <div id="islandExpanded">
        <div id="mobileTimer">00:00</div>
        <div class="history-header" style="margin-top: 1rem;">Move History</div>
        <div id="mobileMoveList" class="move-list-base"></div>
        <div class="ai-toggle-wrap">
          <button class="ai-toggle active" id="mobileAiToggleBtn" type="button" aria-pressed="true" title="AI ON"
            onclick="toggleAi()">
            <span id="mobileAiToggleLabel">AI OFF</span>
          </button>
        </div>
        <div id="mobileHistoryControls"></div>
      </div>
    </div>
  </div>

  <script>
    const chessMasterBleServiceUuid = '19b10000-e8f2-537e-4f6c-d104768a1214';
    const chessMasterBleCharacteristicUuid = '19b10001-e8f2-537e-4f6c-d104768a1214';
    const logoUrl = '/pieces/wk.png';
    const decoder = new TextDecoder();
    let chessMasterBleDevice = null;
    let chessMasterBleCharacteristic = null;
    let board = null;
    const $board = $('#board');
    let game = new Chess();
    let level = 1;
    let ai = false;
    let state = 0;
    let draggable = true;
    let isDragging = false;
    let selectedSquare = null;
    let viewingIndex = -1;
    let autoPlayInterval = null;
    let timerStartedAt = null;
    let timerInterval = null;
    let islandMode = 'hidden';
    let lastIslandTimeStr = '00:00';
    let bleWriteQueue = Promise.resolve();
    let lastBleValidation = null;
    let bleNotificationHandler = null;
    const pendingBleEchoes = [];

    async function isOnline() {
      let online = navigator.onLine;
      if (online) {
        try {
          const response = await fetch('/api', {
            method: 'GET',
            cache: 'no-store'
          });
          online = response.ok;
        } catch (err) {
          online = false;
        }
      }

      return online;
    }

    function updateAiToggleUi(checkOnline = false) {
      [document.getElementById('aiToggleBtn'), document.getElementById('mobileAiToggleBtn')]
        .filter(Boolean)
        .forEach(async (button) => {
          if (checkOnline) {
            const online = await isOnline();
            if (!online) {
              button.disabled = true;
              return;
            }
          }
          const label = button.querySelector('span:last-child');
          button.classList.toggle('active', ai);
          button.setAttribute('aria-pressed', String(ai));
          button.title = ai ? 'AI OFF' : 'AI ON';
          if (label) label.textContent = ai ? 'AI ON' : 'AI OFF';
        });
    }

    async function toggleAi() {
      if (ai) {
        const online = await isOnline();
        if (!online) return;
      }

      ai = !ai;
      updateAiToggleUi();
    }

    updateAiToggleUi(true);

    document.head.insertAdjacentHTML(
      'beforeend',
      `<link rel="icon" href="${logoUrl}">`
    );

    function setRandomFavicon() {
      const pieces = ['wk', 'wq', 'wr', 'wb', 'wn', 'wp'];
      const randomPiece = pieces[Math.floor(Math.random() * pieces.length)];
      const faviconUrl = `/pieces/${randomPiece}.png`;

      const link = document.createElement('link');
      link.rel = 'icon';
      link.href = faviconUrl;
      document.head.appendChild(link);

      const logo = document.getElementById('logo');
      if (logo) {
        logo.src = faviconUrl;
      }
    }

    setRandomFavicon();
    function randomizeTitleCase() {
      const top = document.querySelector('.title-top');
      const bottom = document.querySelector('.title-bottom');
      if (!top || !bottom) return;

      const render = (el, text) => {
        el.innerHTML = '';
        for (const ch of text) {
          if (ch === ' ') {
            el.appendChild(document.createTextNode(' '));
            continue;
          }
          const span = document.createElement('span');
          const upper = Math.random() < 0.5;
          span.textContent = upper ? ch.toUpperCase() : ch.toLowerCase();
          el.appendChild(span);
        }
      };

      render(top, 'CHESS');
      render(bottom, 'MASTER');
    }

    randomizeTitleCase();

    function setLanStatus(message, isError = false) {
      const status = document.getElementById('lanStatus');
      if (status) {
        status.textContent = message;
        status.style.color = isError ? 'var(--error)' : 'var(--text-muted)';
      }
    }

    function showLoadingScreen() {
      const connectPanel = document.getElementById('connectPanel');
      const logo = document.getElementById('logo');
      const loadingScreen = document.getElementById('loadingScreen');

      if (connectPanel) connectPanel.style.display = 'none';
      if (logo) logo.style.display = 'none';
      if (loadingScreen) {
        loadingScreen.style.display = 'flex';
        startLogoAnimation();
      }
    }

    function hideLoadingScreen() {
      const logo = document.getElementById('logo');
      const loadingScreen = document.getElementById('loadingScreen');
      if (loadingScreen) {
        loadingScreen.style.display = 'none';
        stopLogoAnimation();
      }
      if (logo) logo.style.display = '';
    }

    function startLogoAnimation() {
      const pieces = ['wk', 'wq', 'wr', 'wb', 'wn', 'wp'];
      let index = 0;
      const loadingLogo = document.getElementById('loadingLogo');

      if (loadingLogo) {
        loadingLogo.logoAnimationInterval = setInterval(() => {
          loadingLogo.src = `/pieces/${pieces[index]}.png`;
          index = (index + 1) % pieces.length;
        }, 300);
      }
    }

    function stopLogoAnimation() {
      const loadingLogo = document.getElementById('loadingLogo');
      if (loadingLogo && loadingLogo.logoAnimationInterval) {
        clearInterval(loadingLogo.logoAnimationInterval);
        loadingLogo.logoAnimationInterval = null;
      }
    }

    function applyMove(moveText) {
      try {
        const moveResult = game.move({
          from: moveText.substring(0, 2),
          to: moveText.substring(2, 4),
          promotion: 'q'
        });

        if (!moveResult) throw new Error('invalid');
        console.log('valid');

        board.position(game.fen());
        removeMoves();
        removeHighlights();
        const history = game.history({ verbose: true });
        const lastMove = history[history.length - 1];
        $board.find('.square-' + lastMove.from).addClass('highlight');
        $board.find('.square-' + lastMove.to).addClass('highlight');
        updateHistory();
        return true;
      } catch (error) {
        console.log('invalid');
        console.log(error);
        board.position(game.fen());
        return false;
      }
    }

    function updateHistory() {
      const history = game.history({ verbose: true });
      const moveList = document.getElementById('moveListContent');
      const mobileMoveList = document.getElementById('mobileMoveList');
      moveList.innerHTML = '';
      mobileMoveList.innerHTML = '';

      for (let i = 0; i < history.length; i += 2) {
        const moveNumber = document.createElement('span');
        moveNumber.className = 'move-num';
        moveNumber.textContent = `${Math.floor(i / 2) + 1}.`;
        moveList.appendChild(moveNumber);
        mobileMoveList.appendChild(moveNumber.cloneNode(true));

        [history[i], history[i + 1]].filter(Boolean).forEach((move, offset) => {
          const item = document.createElement('span');
          item.className = 'move-item';
          item.textContent = move.from + move.to;
          item.onclick = () => { showPastMove(i + offset); closeIsland(); };
          if (viewingIndex === i + offset + 1 ||
            (viewingIndex === -1 && i + offset + 1 === history.length)) {
            item.classList.add('active');
          }
          moveList.appendChild(item);
          const mobileItem = item.cloneNode(true);
          mobileItem.onclick = () => { showPastMove(i + offset); closeIsland(); };
          mobileMoveList.appendChild(mobileItem);
        });
      }

      const atStart = history.length === 0 || viewingIndex === 0;
      const atEnd = viewingIndex === -1 || viewingIndex === history.length;
      document.getElementById('btnFirstMove').disabled = atStart;
      document.getElementById('btnPrevMove').disabled = atStart;
      document.getElementById('btnNextMove').disabled = atEnd;
      document.getElementById('btnLastMove').disabled = viewingIndex === -1;
      const mobileControls = document.getElementById('mobileHistoryControls');
      if (mobileControls && mobileControls.innerHTML === '') {
        mobileControls.innerHTML = document.getElementById('historyControls').innerHTML;
        Array.from(mobileControls.children).forEach((button) => {
          const originalId = button.id;
          button.id = `mobile_${originalId}`;
          button.onclick = (event) => {
            event.stopPropagation();
            document.getElementById(originalId).click();
          };
        });
      }
      [['btnFirstMove', atStart], ['btnPrevMove', atStart],
      ['btnNextMove', atEnd], ['btnLastMove', viewingIndex === -1]]
        .forEach(([id, disabled]) => {
          const button = document.getElementById(`mobile_${id}`);
          if (button) button.disabled = disabled;
        });
      moveList.scrollTop = moveList.scrollHeight;
      mobileMoveList.scrollTop = mobileMoveList.scrollHeight;
      updateResponsiveHistory();
    }

    function showPastMove(index) {
      const history = game.history({ verbose: true });
      if (index >= history.length) return backToPresent();
      viewingIndex = index;
      const preview = new Chess();
      for (let i = 0; i < index; i++) preview.move(history[i]);
      board.position(preview.fen());
      updateHistory();
      draggable = false;
    }

    function backToPresent() {
      viewingIndex = -1;
      board.position(game.fen());
      updateHistory();
      draggable = true;
      closeIsland();
    }

    function prevMove() {
      const historyLength = game.history().length;
      showPastMove(Math.max(0, (viewingIndex === -1 ? historyLength : viewingIndex) - 1));
      closeIsland();
    }

    function nextMove() {
      const historyLength = game.history().length;
      if (viewingIndex !== -1 && viewingIndex < historyLength) showPastMove(viewingIndex + 1);
      closeIsland();
    }

    function toggleAutoPlay() {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        return;
      }
      if (!game.history().length) return;
      showPastMove(0);
      autoPlayInterval = setInterval(() => {
        if (viewingIndex < game.history().length) nextMove();
        else {
          clearInterval(autoPlayInterval);
          autoPlayInterval = null;
        }
      }, 1000);
    }

    function parseBleMove(value) {
      const moveText = value.trim().toLowerCase();
      if (!/^[a-h][1-8][a-h][1-8](q|r|b|n)?$/.test(moveText)) return null;
      return moveText;
    }

    function prunePendingBleEchoes(now = Date.now()) {
      while (pendingBleEchoes.length && now - pendingBleEchoes[0].timestamp > 5000) {
        pendingBleEchoes.shift();
      }
    }

    function rememberBleEcho(message) {
      pendingBleEchoes.push({
        message,
        timestamp: Date.now()
      });
      prunePendingBleEchoes();
    }

    function consumePendingBleEcho(message) {
      const now = Date.now();
      prunePendingBleEchoes(now);
      const index = pendingBleEchoes.findIndex((entry) => entry.message === message);
      if (index === -1) return false;
      pendingBleEchoes.splice(index, 1);
      return true;
    }

    async function getStockfishMove(fen, level) {
      const url = "https://stockfish.online/api/s/v2.php";
      const params = new URLSearchParams({
        fen: fen,
        depth: Math.max(Math.min(level + 3, 15), 5)
      });

      try {
        const response = await fetch(`${url}?${params}`);
        const data = await response.json();

        if (data.success) {
          const continuation = data.continuation.split(" ");
          return continuation[0];
        } else {
          throw new Error("Error in Stockfish response");
        }
      } catch (error) {
        console.error("Error:", error);
        await new Promise(r => setTimeout(r, 2000));
        return null;
      }
    };

    async function stockfish() {
      try {
        const legalMoves = game.moves({ verbose: true });
        const mistakeChance = Math.max(0.6 - level * 0.08, 0.05);

        let chosen;
        if (Math.random() < mistakeChance) {
          chosen = legalMoves[Math.floor(Math.random() * legalMoves.length)];
          await new Promise(r => setTimeout(r, 500));
        } else {
          const bestMove = await getStockfishMove(game.fen(), level);
          const from = bestMove.substring(0, 2);
          const to = bestMove.substring(2, 4);

          chosen = { from, to, promotion: "q" };
        }

        const uci = `${chosen.from}${chosen.to}${chosen.promotion && chosen.promotion !== "q" ? chosen.promotion : ""}`;
        const piece = game.get(chosen.from);
        if (!applyMove(uci)) throw new Error("invalid");

        return { moveText: uci, piece };
      } catch {
        if (game.turn() === "w") return null;
        return await stockfish();
      }
    }

    async function handleBleMove(value) {
      const message = value.trim();
      const lowerMessage = message.toLowerCase();
      if (consumePendingBleEcho(lowerMessage)) return;
      console.log(lowerMessage);

      if (lowerMessage.startsWith('level')) {
        level = parseInt(lowerMessage.split(' ')[1]) || 1;
        level = Math.max(level, 1);
        level = Math.min(level, 15);
        return;
      }

      if (lowerMessage.startsWith('timer')) {
        const timestampStr = lowerMessage.replace('timer', '').trim();
        if (!timestampStr) {
          if (timerStartedAt) {
            sendBleMessage('timer ' + timerStartedAt).catch((error) => {
              console.error('BLE timer response failed:', error);
            });
          }
        } else {
          timerStartedAt = Number(timestampStr);
          if (!timerInterval) {
            timerInterval = setInterval(updateTimer, 200);
          }
        }
        return;
      }

      if (lowerMessage === 'win' || lowerMessage === 'lose' || lowerMessage === 'draw' || lowerMessage === 'exit') {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        draggable = false;
        const island = document.getElementById('island');
        const islandStatus = document.getElementById('islandStatus');

        if (lowerMessage === 'win') {
          state = 1;
          islandMode = 'result';
          if (islandStatus) islandStatus.textContent = 'Win!';
          if (island) island.style.setProperty('--result-bg', getComputedStyle(document.documentElement).getPropertyValue('--success').trim() || '#22c55e');
        } else if (lowerMessage === 'lose') {
          state = 2;
          islandMode = 'result';
          if (islandStatus) islandStatus.textContent = 'Lose!';
          if (island) island.style.setProperty('--result-bg', getComputedStyle(document.documentElement).getPropertyValue('--error').trim() || '#ef4444');
        } else if (lowerMessage === 'draw') {
          state = 3;
          islandMode = 'result';
          if (islandStatus) islandStatus.textContent = 'Draw!';
          if (island) island.style.setProperty('--result-bg', '#f59e0b');
        } else if (lowerMessage === 'exit') {
          state = 0;
          sessionStorage.setItem('gameEnded', 'true');
          window.location.href = '/';
          return;
        }

        if (island) island.classList.remove('expanded');
        updateIslandVisibility();
        return;
      }

      const move = parseBleMove(lowerMessage);
      if (!move) return;

      const now = Date.now();
      if (lastBleValidation &&
        lastBleValidation.move === move &&
        now - lastBleValidation.timestamp < 5000) {
        sendBleMessage(lastBleValidation.response).catch((error) => {
          console.error('BLE duplicate validation response failed:', error);
        });
        return;
      }

      const isValid = applyMove(move);
      const response = isValid ? 'valid' : 'invalid';
      lastBleValidation = {
        move,
        response,
        timestamp: now
      };

      if (isValid && !timerStartedAt) {
        startTimer();
        sendBleMessage('timer ' + Math.floor(Date.now() / 1000)).catch((error) => {
          console.error('BLE timer send failed:', error);
        });
      }

      sendBleMessage(response).catch((error) => {
        console.error('BLE validation response failed:', error);
      });

      if (ai && isValid) {
        await new Promise(resolve => setTimeout(resolve, 2000));
        if (!ai) return;
        const result = await stockfish();
        if (!result) return;
        sendBlackMove(result.moveText, result.piece).catch((error) => {
          console.error('BLE message send failed:', error);
          game.undo();
          board.position(game.fen());
          updateHistory();
          console.error(error.message || 'Unable to send move to Chess Master.');
        });
      }
    }

    function sendBleMessage(message) {
      const write = async () => {
        if (!chessMasterBleCharacteristic) {
          throw new Error('BLE characteristic is not connected.');
        }

        if (!chessMasterBleCharacteristic.properties.write &&
          !chessMasterBleCharacteristic.properties.writeWithoutResponse) {
          throw new Error('Connected BLE characteristic is not writable.');
        }

        const data = new TextEncoder().encode(message);
        rememberBleEcho(message.toLowerCase());
        if (chessMasterBleCharacteristic.properties.write) {
          await chessMasterBleCharacteristic.writeValueWithResponse(data);
        } else {
          await chessMasterBleCharacteristic.writeValueWithoutResponse(data);
        }
      };

      const queuedWrite = bleWriteQueue.then(write);
      bleWriteQueue = queuedWrite.catch(() => { });
      return queuedWrite;
    }

    function startTimer(start = Date.now()) {
      if (timerInterval) clearInterval(timerInterval);
      timerStartedAt = start;
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerStartedAt) / 1000);
        const hours = Math.floor(elapsed / 3600);
        const mins = Math.floor((elapsed % 3600) / 60).toString().padStart(2, '0');
        const secs = (elapsed % 60).toString().padStart(2, '0');

        let timeStr = "";
        if (hours > 0) {
          timeStr = `${hours}:${mins}:${secs}`;
        } else {
          timeStr = `${mins}:${secs}`;
        }
        document.getElementById('gameTimerDisplay').textContent = timeStr;
        lastIslandTimeStr = timeStr;
        const island = document.getElementById('island');
        const islandStatus = document.getElementById('islandStatus');
        if (island && islandStatus && island.classList.contains('visible') && islandMode === 'timer' && !island.classList.contains('expanded')) {
          islandStatus.textContent = timeStr;
        }
      }, 200);
    }

    async function sendBlackMove(moveText, piece) {
      const from = moveText.substring(0, 2);
      const to = moveText.substring(2, 4);

      let messageToSend = moveText;
      if (piece) {
        messageToSend = piece.type.toLowerCase() + moveText;
      }

      await sendBleMessage(messageToSend);
      console.log(messageToSend);
    }

    function onDrop(source, target) {
      if (!source || !draggable || game.turn() !== 'b') return 'snapback';

      if (target !== source && selectedSquare !== source) removeMoves();

      if (source === target) {
        if (selectedSquare !== source) {
          if (selectedSquare) $board.find('.square-' + selectedSquare).removeClass('highlight'); $board.find('.square-' + source).addClass('highlight');
          selectedSquare = source;
          highlightPossibleMoves(source);
        } else {
          $board.find('.square-' + source).removeClass('highlight');
          removeMoves();
          selectedSquare = null;
        }
        return undefined;
      }

      const moveText = source + target;
      const piece = game.get(source);
      if (!applyMove(moveText)) return 'snapback';

      selectedSquare = null;
      removeMoves();
      removeHighlights();
      $board.find('.square-' + source).addClass('highlight'); $board.find('.square-' + target).addClass('highlight');

      if (!timerStartedAt) {
        timerStartedAt = Date.now();
        timerInterval = setInterval(updateTimer, 200);
      }

      if (!isDragging) {
        board.position(game.fen());
      }
      isDragging = false;

      sendBlackMove(moveText, piece).catch((error) => {
        console.error('BLE message send failed:', error);
        game.undo();
        board.position(game.fen());
        updateHistory();
        console.error(error.message || 'Unable to send move to Chess Master.');
      });
      return undefined;
    }

    function removeHighlights() {
      $board.find('.square-55d63').removeClass('highlight');
    }

    function addMoves(square) {
      const squareElement = document.querySelector(`.square-${square}`);
      if (!squareElement) return;
      const highlight = document.createElement('div');
      highlight.className = 'highlight-square';
      squareElement.appendChild(highlight);
    }

    function removeMoves() {
      document.querySelectorAll('.highlight-square').forEach((highlight) => {
        highlight.remove();
      });
    }

    function highlightPossibleMoves(square) {
      removeMoves();
      game.moves({ square, verbose: true }).forEach((move) => addMoves(move.to));
    }

    function updateTimer() {
      if (!timerStartedAt) return;
      const elapsed = Math.floor((Date.now() - timerStartedAt) / 1000);
      const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const secs = (elapsed % 60).toString().padStart(2, '0');
      document.getElementById('gameTimerDisplay').textContent = `${mins}:${secs}`;
      document.getElementById('mobileTimer').textContent = `${mins}:${secs}`;
      lastIslandTimeStr = `${mins}:${secs}`;
      updateIslandVisibility();
    }

    function isHistoryPanelVisible() {
      return getComputedStyle(document.getElementById('historyPanel')).display !== 'none';
    }

    function updateHistoryPanelVisibility() {
      const historyPanel = document.getElementById('historyPanel');
      const boardElement = document.getElementById('board');
      if (!historyPanel || !boardElement) return;

      const boardVisible = getComputedStyle(boardElement).display !== 'none';
      if (!boardVisible) {
        historyPanel.style.display = 'none';
        return;
      }

      const historyStyle = getComputedStyle(historyPanel);
      const historyWidth = parseFloat(historyStyle.width) || 320;
      const historyRight = parseFloat(historyStyle.right) || 0;
      const historyLeft = window.innerWidth - historyRight - historyWidth;
      const boardRect = boardElement.getBoundingClientRect();
      historyPanel.style.display = boardRect.right + 24 <= historyLeft ? 'flex' : 'none';
    }

    function updateIslandVisibility() {
      const island = document.getElementById('island');
      const islandStatus = document.getElementById('islandStatus');
      if (!island || !islandStatus) return;

      if (islandMode !== 'result') island.style.removeProperty('--result-bg');
      island.dataset.mode = islandMode;

      if (islandMode === 'hidden') {
        island.classList.remove('visible', 'expanded');
        return;
      }

      if (islandMode === 'timer' && isHistoryPanelVisible()) {
        island.classList.remove('visible', 'expanded');
        return;
      }

      island.classList.add('visible');
      if (islandMode === 'timer' && !island.classList.contains('expanded')) {
        islandStatus.textContent = lastIslandTimeStr;
      }
    }

    function updateResponsiveHistory() {
      updateHistoryPanelVisibility();
      updateIslandVisibility();
    }

    function openIsland() {
      if (!isHistoryPanelVisible()) document.getElementById('island').classList.add('expanded');
    }

    function closeIsland() {
      document.getElementById('island').classList.remove('expanded');
    }

    document.getElementById('island').addEventListener('click', (event) => {
      if (event.target.closest('#islandHandle') || event.target.closest('#islandCollapsed')) {
        const island = document.getElementById('island');
        island.classList.contains('expanded') ? closeIsland() : openIsland();
      }
    });

    document.addEventListener('click', (e) => {
      const island = document.getElementById('island');
      if (island && !island.contains(e.target)) {
        closeIsland();
      }
    });

    function startLanGame() {
      document.getElementById('connectPanel').style.display = 'none';
      document.getElementById('lanGame').style.display = 'flex';
      document.getElementById('board').style.display = 'block';
      islandMode = 'timer';

      board = Chessboard('board', {
        draggable,
        position: 'start',
        orientation: 'black',
        onDragStart: (source, piece) => {
          isDragging = true;
          board.draggable = draggable;
          if (!draggable || game.game_over() || game.turn() !== 'b' || piece.search(/^w/) !== -1) return false;
          document.querySelectorAll('#board .square-55d63').forEach((square) => {
            square.addEventListener('click', (event) => {
              if (viewingIndex !== -1 || !selectedSquare) return;
              isDragging = false;
              const target = event.currentTarget.getAttribute('data-square');
              onDrop(selectedSquare, target);
            }, { once: true });
          });
          highlightPossibleMoves(source);
        },
        onDrop,
        pieceTheme: (piece) =>
          `/pieces/${piece.toLowerCase()}.png`
      });
      $(window).resize(() => board.resize());
      updateHistory();
      window.addEventListener('resize', updateResponsiveHistory);
      updateResponsiveHistory();
      hideLoadingScreen();
    }

    async function connectToChessMasterBle() {
      const button = document.getElementById('lanConnectBtn');
      if (!navigator.bluetooth) {
        setLanStatus('Web Bluetooth is not supported by this browser.', true);
        return;
      }
      if (!window.isSecureContext) {
        setLanStatus('Bluetooth requires HTTPS or localhost.', true);
        return;
      }

      try {
        button.disabled = true;
        setLanStatus('Choose a Chess Master device from the Bluetooth menu...');
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [chessMasterBleServiceUuid] }]
        });

        showLoadingScreen();

        chessMasterBleDevice = device;
        device.addEventListener('gattserverdisconnected', () => {
          hideLoadingScreen();
          setLanStatus('Chess Master disconnected.', true);
          button.disabled = false;
        }, { once: true });

        if (!device.gatt) throw new Error('GATT is not available for this device.');
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(chessMasterBleServiceUuid);
        if (chessMasterBleCharacteristic && bleNotificationHandler) {
          chessMasterBleCharacteristic.removeEventListener('characteristicvaluechanged', bleNotificationHandler);
        }
        chessMasterBleCharacteristic = await service.getCharacteristic(chessMasterBleCharacteristicUuid);
        bleNotificationHandler = (event) => {
          const message = decoder.decode(event.target.value);
          handleBleMove(message);
        };
        chessMasterBleCharacteristic.addEventListener('characteristicvaluechanged', bleNotificationHandler);
        await chessMasterBleCharacteristic.startNotifications();

        startLanGame();
      } catch (error) {
        button.disabled = false;
        hideLoadingScreen();
        if (error.name === 'NotFoundError') {
          setLanStatus('No Chess Master device selected.');
          return;
        }
        setLanStatus(error.message || 'Unable to connect to Chess Master.', true);
      }
    }
  </script>
</body>
